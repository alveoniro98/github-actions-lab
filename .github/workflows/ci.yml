name: CI/CD Pipeline

on:
  push:
    branches:
      - main

jobs:

  build:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ vars.PYHTON_VERSION }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Check configuration
        run: |
          echo "Application: ${{ vars.APP_NAME }}"

      - name: Build application
        run: |
          mkdir build
          cp app.py build/
          cp requirements.txt build/
          zip -r application.zip build/

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: application-build
          path: application.zip


  test:
    needs: build
    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ vars.PYHTON_VERSION }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run tests
        run: pytest -v


  deploy-development:
    needs: test
    runs-on: ubuntu-latest
    environment: development

    steps:

      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: application-build

      - name: Deploy to Development
        run: |
          unzip application.zip
          echo "Deploying application to DEVELOPMENT..."
          ls -la build/

      - name: Check secret
        env:
          DEMO_ENV: ${{ secrets.DEMO_ENV }}
        run: |
          echo "Secret has been loaded successfully"


  deploy-staging:
    needs: deploy-development
    runs-on: ubuntu-latest
    environment: staging

    steps:

      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: application-build

      - name: Deploy to Staging
        run: |
          unzip application.zip
          echo "Deploying application to STAGING..."
          ls -la build/
        
      - name: Check secret
        env:
          DEMO_ENV: ${{ secrets.DEMO_ENV }}
        run: |
          echo "Secret has been loaded successfully"


  deploy-production:
    needs: deploy-staging
    runs-on: ubuntu-latest
    environment: production

    steps:

      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: application-build

      - name: Deploy to Production
        run: |
          unzip application.zip
          echo "Deploying application to PRODUCTION..."
          ls -la build/

      - name: Deployment summary
        run: |
          echo "## Production Deployment" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Application: ${{ vars.APP_NAME}}" >> $GITHUB_STEP_SUMMARY
          echo "Environment: Production" >> $GITHUBB_STEP_SUMMARY
          echo "Status: Successful" >> $GITHUB_STEP_SUMMARY

      - name: Check secret
        env:
          DEMO_ENV: ${{ secrets.DEMO_ENV }}
        run: |
          echo "Secret has been loaded successfully"